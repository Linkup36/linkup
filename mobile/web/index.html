<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Linkup Marketplace</title>

    <!-- Google Fonts: Syne (700, 800) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- The react-native-web recommended style reset & Syne font styling -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      :root {
        --font-display: 'Syne', sans-serif;
        --font-sans: 'Inter', sans-serif;
      }

      /* Any bold / heading text generated by React Native Web automatically uses Syne */
      [style*="font-weight: 700"],
      [style*="font-weight: 800"],
      [style*="font-weight: 900"],
      [style*="font-weight: bold"],
      [style*="font-weight:bold"],
      [style*="font-weight:700"],
      [style*="font-weight:800"],
      [style*="font-weight:900"] {
        font-family: 'Syne', sans-serif !important;
      }

      h1, h2, h3, h4, h5, h6, .font-display, [data-font="display"] {
        font-family: 'Syne', sans-serif !important;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>

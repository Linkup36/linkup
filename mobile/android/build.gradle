// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects { subproject ->
  subproject.afterEvaluate {
    if (subproject.hasProperty('android')) {
      try {
        if (subproject.android.compileSdk == null) {
          subproject.android.compileSdk = 37
        }
      } catch (Exception ignored) {}

      if (subproject.name == 'expo-dev-launcher' || subproject.name == 'expo-dev-menu') {
        try {
          def releaseSourceSet = subproject.android.sourceSets.findByName('release')
          if (releaseSourceSet != null) {
            def disableDir = subproject.file('src/disableInRelease/java')
            if (disableDir.exists()) {
              releaseSourceSet.java.srcDir(disableDir)
              try { releaseSourceSet.kotlin.srcDir(disableDir) } catch (Exception ignored) {}
            }
          }
        } catch (Exception ignored) {}
      }
    }
  }
}


apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

